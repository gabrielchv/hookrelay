apiVersion: apps/v1
kind: Deployment
metadata:
  name: hookrelay-worker
  namespace: hookrelay
  labels:
    app.kubernetes.io/name: hookrelay
    app.kubernetes.io/component: worker
spec:
  # Workers are safe to scale horizontally: the Redis delivery lease prevents
  # two pods from sending the same delivery at once.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hookrelay
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hookrelay
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Workers hold no request state; give in-flight deliveries time to finish
      # before the pod goes away.
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: hookrelay:local
          command: ["node", "dist/main.js", "worker"]
          envFrom:
            - configMapRef:
                name: hookrelay-config
            - secretRef:
                name: hookrelay-secrets
          # A worker has no HTTP server, so liveness is process-only: if the
          # container is running, the broker loop is running.
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hookrelay-worker
  namespace: hookrelay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hookrelay-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
