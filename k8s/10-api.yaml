apiVersion: apps/v1
kind: Deployment
metadata:
  name: hookrelay-api
  namespace: hookrelay
  labels:
    app.kubernetes.io/name: hookrelay
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hookrelay
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hookrelay
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: hookrelay:local
          command: ["node", "dist/main.js", "api"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: hookrelay-config
            - secretRef:
                name: hookrelay-secrets
          # readiness gates traffic; liveness only catches a wedged process.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: hookrelay-api
  namespace: hookrelay
spec:
  selector:
    app.kubernetes.io/name: hookrelay
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hookrelay-api
  namespace: hookrelay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hookrelay-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hookrelay-api
  namespace: hookrelay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hookrelay
      app.kubernetes.io/component: api
