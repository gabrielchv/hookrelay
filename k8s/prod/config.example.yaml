# Production-side configuration, kept separate from the workload manifests so the
# same Deployments run unchanged against a real AWS account or the local moto
# mock. Copy to config.yaml, fill in the real queue URL, and `kubectl apply`.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hookrelay-config
  namespace: hookrelay
data:
  NODE_ENV: production
  LOG_LEVEL: info
  BROKER: sqs
  REDIS_URL: redis://redis:6379
  AWS_REGION: us-east-1
  ENDPOINTS_TABLE: hookrelay_endpoints
  DELIVERIES_TABLE: hookrelay_deliveries
  MAX_ATTEMPTS: "5"
  BASE_BACKOFF_MS: "250"
  MAX_BACKOFF_MS: "30000"
  RATE_LIMIT_PER_SEC: "20"
  SCHEDULER_INTERVAL_MS: "200"
---
# Placeholder only. In a real cluster this comes from External Secrets / SSM
# scoped to the task IAM role (see terraform/), never from a committed manifest.
apiVersion: v1
kind: Secret
metadata:
  name: hookrelay-secrets
  namespace: hookrelay
type: Opaque
stringData:
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/000000000000/hookrelay-dev-deliveries"
